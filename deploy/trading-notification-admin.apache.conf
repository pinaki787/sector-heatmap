<VirtualHost *:80>
    ServerName utrading.pinakicloud.com
    DocumentRoot /var/www/html
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://utrading.pinakicloud.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName utrading.pinakicloud.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/utrading.pinakicloud.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/utrading.pinakicloud.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    ProxyRequests Off
    # Only this exact public origin is translated; foreign/missing origins fail CSRF checks.
    RequestHeader set Origin "http://127.0.0.1:8080" "expr=req('Origin') == 'https://utrading.pinakicloud.com'"
    ProxyPass /api/notification-admin/ http://127.0.0.1:8090/api/notification-admin/ connectiontimeout=5 timeout=30
    ProxyPassReverse /api/notification-admin/ http://127.0.0.1:8090/api/notification-admin/
    ProxyPass / http://127.0.0.1:8080/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://127.0.0.1:8080/
    ErrorLog ${APACHE_LOG_DIR}/trading-ssl-error.log
    # Preserve callback audit status without retaining its authorization token.
    SetEnvIfExpr "%{QUERY_STRING} =~ /(^|&)authtoken=/" motilal_callback
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" motilal_callback_no_query
    CustomLog ${APACHE_LOG_DIR}/trading-ssl-access.log combined env=!motilal_callback
    CustomLog ${APACHE_LOG_DIR}/trading-ssl-access.log motilal_callback_no_query env=motilal_callback
</VirtualHost>
